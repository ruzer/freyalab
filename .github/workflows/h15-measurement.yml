name: H15-1 measurement (temporary)
on:
  pull_request:
    paths:
      - '.github/workflows/h15-measurement.yml'
      - 'tests/e2e/h15-measurement.spec.ts'
permissions:
  contents: read
jobs:
  measure:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/h15-1-columna-calculada'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Measure the calculation from Electron and compare the saved bytes
        run: |
          uname -m
          sysctl -n hw.logicalcpu hw.memsize
          npx playwright test tests/e2e/h15-measurement.spec.ts --project=csv --workers=1 --retries=0 --repeat-each=3 --reporter=list
