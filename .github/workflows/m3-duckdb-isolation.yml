name: M3 DuckDB isolation (experiment)
# Experimento de evaluación (línea B del RFC §7.4): aislamiento del sistema operativo, memoria, empaquetado y firma de DuckDB nativo.
# No forma parte de la verificación del producto. @duckdb/node-api se instala SOLO en una carpeta temporal del ejecutor.
on:
  pull_request:
    paths:
      - 'experiments/duckdb-isolation/**'
      - '.github/workflows/m3-duckdb-isolation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m3-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolation:
    name: Isolation ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install @duckdb/node-api outside the repository
        run: |
          mkdir -p "$RUNNER_TEMP/m3/duckdb-native" "$RUNNER_TEMP/m3out"
          cd "$RUNNER_TEMP/m3/duckdb-native"
          npm init -y >/dev/null
          npm install @duckdb/node-api@2.0.0-r.1 --save-exact --ignore-scripts --no-audit --no-fund
      - name: Install bubblewrap (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: OS isolation layer around a Node process running DuckDB
        continue-on-error: true
        run: node experiments/duckdb-isolation/isolation.mjs --runtime node --install "$RUNNER_TEMP/m3/duckdb-native" --work "$RUNNER_TEMP/m3work-node" --out "$RUNNER_TEMP/m3out/isolation-node.json"
      - name: Show result
        if: always()
        run: |
          ls -la "$RUNNER_TEMP/m3out" || true
          cat "$RUNNER_TEMP/m3out/isolation-node.json" 2>/dev/null | head -150 || true
          ls -la "$RUNNER_TEMP/m3work-node/confinada" 2>/dev/null | head -20 || true
          cat "$RUNNER_TEMP/m3work-node/confinada/stderr.txt" 2>/dev/null | head -30 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m3-isolation-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/m3out
            ${{ runner.temp }}/m3work-node/confinada/*.txt
            ${{ runner.temp }}/m3work-node/confinada/*.json
          if-no-files-found: warn
