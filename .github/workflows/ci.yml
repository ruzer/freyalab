name: CI
on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/*.md'
      - 'docs/audit/**'
      - 'docs/stories/**'
      - 'docs/design/*.md'
      - 'docs/design/*.html'
      - 'docs/evidence/**/*.md'
      - 'docs/evidence/**/*.png'
      - 'docs/evidence/**/*.html'
      - 'docs/evidence/**/*.pdf'
      - 'docs/evidence/**/*.docx'
  pull_request:
  schedule:
    - cron: '23 7 * * *' # 01:23 en Ciudad de México (UTC−6).
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  areas:
    name: Calculate PR areas
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      package: ${{ steps.plan.outputs.package }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Classify changed paths
        id: plan
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          plan=$(git diff --name-only --no-renames -z "$BASE_SHA...$HEAD_SHA" | node scripts/ci-areas.mjs --stdin)
          node --input-type=module - "$plan" <<'NODE' >> "$GITHUB_OUTPUT"
          import {areaCommand} from './scripts/ci-e2e-area.mjs'
          const {e2e,full,package:pack}=JSON.parse(process.argv[2])
          if(typeof pack!=='boolean')throw new Error('Plan de empaquetado inválido')
          const plan=JSON.stringify({e2e,full})
          console.error('Proyectos E2E:',areaCommand(plan,[]).slice(2).join(' '),'| Paquete:',pack||full)
          console.log('plan='+plan)
          console.log('package='+(pack||full))
          NODE
  verify:
    needs: areas
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.areas.result == 'success') }}
    name: Verify ${{ matrix.os }}${{ matrix.part && format(' ({0})', matrix.part) || '' }}
    strategy:
      fail-fast: false
      matrix:
        # Intel reparte la suite en main y de noche; los PR no crean sus jobs.
        include: >-
          ${{ fromJSON(
            github.event_name == 'schedule' &&
            '[{"os":"macos-15-intel","part":"shell-md","projects":"--project=shell --project=md"},{"os":"macos-15-intel","part":"csv-package","projects":"--project=csv","executable":"release/mac/FreyaLab.app/Contents/MacOS/FreyaLab"}]' ||
            github.event_name == 'pull_request' &&
            '[{"os":"ubuntu-24.04","executable":"release/linux-unpacked/freyalab"},{"os":"windows-2025","executable":"release/win-unpacked/FreyaLab.exe"},{"os":"macos-15","executable":"release/mac-arm64/FreyaLab.app/Contents/MacOS/FreyaLab"}]' ||
            '[{"os":"ubuntu-24.04","executable":"release/linux-unpacked/freyalab"},{"os":"windows-2025","executable":"release/win-unpacked/FreyaLab.exe"},{"os":"macos-15","executable":"release/mac-arm64/FreyaLab.app/Contents/MacOS/FreyaLab"},{"os":"macos-15-intel","part":"shell-md","projects":"--project=shell --project=md"},{"os":"macos-15-intel","part":"csv-package","projects":"--project=csv","executable":"release/mac/FreyaLab.app/Contents/MacOS/FreyaLab"}]'
          ) }}
    runs-on: ${{ matrix.os }}
    env:
      FREYALAB_E2E_FAST_WORKERS: ${{ matrix.os == 'macos-15' && '2' || '1' }}
    # Gate exige la confirmación de las tres plataformas, incluso si una queda cancelada en cola.
    outputs:
      ubuntu: ${{ github.event_name == 'pull_request' && matrix.os == 'ubuntu-24.04' && job.status == 'success' && 'passed' || '' }}
      windows: ${{ github.event_name == 'pull_request' && matrix.os == 'windows-2025' && job.status == 'success' && 'passed' || '' }}
      macos: ${{ github.event_name == 'pull_request' && matrix.os == 'macos-15' && job.status == 'success' && 'passed' || '' }}
    # Las dos partes Intel conservan el mismo límite que tenía el job completo.
    timeout-minutes: ${{ matrix.os == 'macos-15-intel' && 90 || matrix.os == 'macos-15' && 75 || ((matrix.os == 'windows-2025' || startsWith(matrix.os, 'macos-')) && 60 || 45) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Prepare Electron sandbox helper (Linux)
        if: runner.os == 'Linux'
        run: |
          node -e "require('electron')"
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - run: npm run check
        if: matrix.part != 'csv-package'
      - run: npm test
        if: matrix.part != 'csv-package'
      - name: Large-file editor experiments (correctness on small hostile fixtures)
        if: matrix.part != 'csv-package'
        run: node --test experiments/large-file-editor/tests/overlay.test.mjs
      - run: npm run licenses
        if: matrix.part != 'shell-md'
      - name: E2E fast (PR areas)
        id: e2e_fast_pr
        if: github.event_name == 'pull_request'
        env:
          FREYALAB_CI_AREAS: ${{ needs.areas.outputs.plan }}
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-fast
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}npm run test:e2e:area -- --phase=fast --workers=${{ env.FREYALAB_E2E_FAST_WORKERS }} --output=test-results-fast
      - name: E2E fast (Linux)
        id: e2e_fast_linux
        if: github.event_name != 'pull_request' && runner.os == 'Linux'
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-fast
        run: xvfb-run -a npm run test:e2e:fast -- --workers=${{ env.FREYALAB_E2E_FAST_WORKERS }} --output=test-results-fast
      - name: E2E fast (macOS and Windows)
        id: e2e_fast_desktop
        if: github.event_name != 'pull_request' && runner.os != 'Linux'
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-fast
        run: npm run test:e2e:fast -- --workers=${{ env.FREYALAB_E2E_FAST_WORKERS }} --output=test-results-fast ${{ matrix.projects }}
      - name: E2E perf and solo (PR areas)
        if: ${{ !cancelled() && github.event_name == 'pull_request' && (steps.e2e_fast_pr.outcome == 'success' || steps.e2e_fast_pr.outcome == 'failure') }}
        env:
          FREYALAB_CI_AREAS: ${{ needs.areas.outputs.plan }}
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-solo
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}npm run test:e2e:area -- --phase=serial --workers=1 --output=test-results-solo
      - name: E2E perf and solo (Linux)
        if: ${{ !cancelled() && runner.os == 'Linux' && (steps.e2e_fast_linux.outcome == 'success' || steps.e2e_fast_linux.outcome == 'failure') }}
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-solo
        run: xvfb-run -a npm run test:e2e:perf -- --workers=1 --output=test-results-solo
      - name: E2E perf and solo (macOS and Windows)
        if: ${{ !cancelled() && runner.os != 'Linux' && matrix.part != 'shell-md' && (steps.e2e_fast_desktop.outcome == 'success' || steps.e2e_fast_desktop.outcome == 'failure') }}
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-solo
        run: npm run test:e2e:perf -- --workers=1 --output=test-results-solo
      - name: Package application directory
        id: package
        if: matrix.part != 'shell-md' && (github.event_name != 'pull_request' || needs.areas.outputs.package == 'true')
        run: npx electron-builder --dir
      - name: Prepare packaged sandbox helper (Linux)
        if: runner.os == 'Linux' && steps.package.outcome == 'success'
        run: |
          sudo chown root:root release/linux-unpacked/chrome-sandbox
          sudo chmod 4755 release/linux-unpacked/chrome-sandbox
      - name: CSV analysis and transforms in packaged application (Linux)
        if: runner.os == 'Linux' && steps.package.outcome == 'success'
        env:
          FREYALAB_EXECUTABLE: ${{ github.workspace }}/${{ matrix.executable }}
        run: xvfb-run -a npx playwright test tests/e2e/structural-context.spec.ts tests/e2e/commands.spec.ts tests/e2e/search.spec.ts tests/e2e/sql.spec.ts tests/e2e/charts.spec.ts tests/e2e/structure.spec.ts tests/e2e/ordering.spec.ts tests/e2e/range-cancellation.spec.ts tests/e2e/selection-statistics.spec.ts tests/e2e/statistics-reports.spec.ts --output=packaged-test-results
      - name: CSV analysis and transforms in packaged application (macOS and Windows)
        if: runner.os != 'Linux' && matrix.part != 'shell-md' && steps.package.outcome == 'success'
        env:
          FREYALAB_EXECUTABLE: ${{ github.workspace }}/${{ matrix.executable }}
        run: npx playwright test tests/e2e/structural-context.spec.ts tests/e2e/commands.spec.ts tests/e2e/search.spec.ts tests/e2e/sql.spec.ts tests/e2e/charts.spec.ts tests/e2e/structure.spec.ts tests/e2e/ordering.spec.ts tests/e2e/range-cancellation.spec.ts tests/e2e/selection-statistics.spec.ts tests/e2e/statistics-reports.spec.ts --output=packaged-test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ matrix.os }}${{ matrix.part && format('-{0}', matrix.part) || '' }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
            playwright-report-fast/
            playwright-report-solo/
            test-results-fast/
            test-results-solo/
            packaged-test-results/
          if-no-files-found: warn
  gate:
    name: Gate
    needs: [areas, verify]
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require the plan and all three platforms
        env:
          AREAS_RESULT: ${{ needs.areas.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          UBUNTU: ${{ needs.verify.outputs.ubuntu }}
          WINDOWS: ${{ needs.verify.outputs.windows }}
          MACOS: ${{ needs.verify.outputs.macos }}
        run: |
          if [[ "$AREAS_RESULT" != success || "$VERIFY_RESULT" != success ||
                "$UBUNTU/$WINDOWS/$MACOS" != passed/passed/passed ]]; then
            echo "Gate falló. Áreas: $AREAS_RESULT. Matriz: $VERIFY_RESULT. Ubuntu: ${UBUNTU:-sin éxito}. Windows: ${WINDOWS:-sin éxito}. macOS: ${MACOS:-sin éxito}."
            exit 1
          fi
