name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Verify ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            executable: release/linux-unpacked/freyalab
          - os: windows-2025
            executable: release/win-unpacked/FreyaLab.exe
          - os: macos-15
            executable: release/mac-arm64/FreyaLab.app/Contents/MacOS/FreyaLab
          - os: macos-15-intel
            executable: release/mac/FreyaLab.app/Contents/MacOS/FreyaLab
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run licenses
      - run: npm run build
      - name: E2E Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e
      - name: E2E macOS and Windows
        if: runner.os != 'Linux'
        run: npm run test:e2e
      - name: Package application directory
        run: npx electron-builder --dir
      - name: SQL in packaged application (Linux)
        if: runner.os == 'Linux'
        env:
          FREYALAB_EXECUTABLE: ${{ github.workspace }}/${{ matrix.executable }}
        run: xvfb-run -a npx playwright test tests/e2e/sql.spec.ts --output=packaged-test-results
      - name: SQL in packaged application (macOS and Windows)
        if: runner.os != 'Linux'
        env:
          FREYALAB_EXECUTABLE: ${{ github.workspace }}/${{ matrix.executable }}
        run: npx playwright test tests/e2e/sql.spec.ts --output=packaged-test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
            packaged-test-results/
          if-no-files-found: warn
