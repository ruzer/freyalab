name: CI
on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/*.md'
      - 'docs/audit/**'
      - 'docs/stories/**'
      - 'docs/design/*.md'
      - 'docs/design/*.html'
      - 'docs/evidence/**/*.md'
      - 'docs/evidence/**/*.png'
      - 'docs/evidence/**/*.html'
      - 'docs/evidence/**/*.pdf'
      - 'docs/evidence/**/*.docx'
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * *' # 01:23 en Ciudad de México (UTC−6).
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  areas:
    name: Calculate PR areas
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      package: ${{ steps.plan.outputs.package }}
      docs_only: ${{ steps.plan.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Classify changed paths
        id: plan
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          plan=$(git diff --name-only --no-renames -z "$BASE_SHA...$HEAD_SHA" | node scripts/ci-areas.mjs --stdin)
          node --input-type=module - "$plan" <<'NODE' >> "$GITHUB_OUTPUT"
          import {areaCommand} from './scripts/ci-e2e-area.mjs'
          const {e2e,full,package:pack,docsOnly}=JSON.parse(process.argv[2])
          if(typeof pack!=='boolean'||typeof docsOnly!=='boolean'||(docsOnly&&(full||pack||e2e.length))){
            throw new Error('Plan de CI inválido')
          }
          const plan=JSON.stringify({e2e,full})
          const projects=areaCommand(plan,[]).slice(2).join(' ')
          console.error(docsOnly?'Solo documentación: Verify se omite.':'Proyectos E2E: '+projects+' | Paquete: '+(pack||full))
          console.log('plan='+plan)
          console.log('package='+(pack||full))
          console.log('docs_only='+docsOnly)
          NODE
  verify:
    needs: areas
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') && (github.event_name != 'pull_request' || (needs.areas.result == 'success' && needs.areas.outputs.docs_only == 'false')) }}
    name: Verify ${{ matrix.os }}${{ matrix.part && format(' ({0})', matrix.part) || '' }}
    strategy:
      fail-fast: false
      matrix:
        # Todas las plataformas ejecutan perf/solo en shell-md; Ubuntu conserva el paquete en CSV y Windows en shell-md.
        # Intel solo en nocturna/manual sobre main; ARM e Intel conservan el paquete separado.
        include: >-
          ${{ fromJSON(
            (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
            '[{"os":"macos-15-intel","part":"shell-md","projects":"--project=shell --project=md"},{"os":"macos-15-intel","part":"csv","projects":"--project=csv"},{"os":"macos-15-intel","part":"package","executable":"release/mac/FreyaLab.app/Contents/MacOS/FreyaLab"}]' ||
            github.event_name == 'pull_request' && needs.areas.outputs.package == 'true' &&
            '[{"os":"ubuntu-24.04","part":"shell-md","projects":"--project=shell --project=md"},{"os":"ubuntu-24.04","part":"csv-package","projects":"--project=csv","executable":"release/linux-unpacked/freyalab"},{"os":"windows-2025","part":"shell-md","projects":"--project=shell --project=md","executable":"release/win-unpacked/FreyaLab.exe"},{"os":"windows-2025","part":"csv","projects":"--project=csv"},{"os":"macos-15","part":"shell-md","projects":"--project=shell --project=md"},{"os":"macos-15","part":"csv","projects":"--project=csv"},{"os":"macos-15","part":"package","executable":"release/mac-arm64/FreyaLab.app/Contents/MacOS/FreyaLab"}]' ||
            github.event_name == 'pull_request' &&
            '[{"os":"ubuntu-24.04","part":"shell-md","projects":"--project=shell --project=md"},{"os":"ubuntu-24.04","part":"csv","projects":"--project=csv"},{"os":"windows-2025","part":"shell-md","projects":"--project=shell --project=md","executable":"release/win-unpacked/FreyaLab.exe"},{"os":"windows-2025","part":"csv","projects":"--project=csv"},{"os":"macos-15","part":"shell-md","projects":"--project=shell --project=md"},{"os":"macos-15","part":"csv","projects":"--project=csv"}]' ||
            '[{"os":"ubuntu-24.04","part":"shell-md","projects":"--project=shell --project=md"},{"os":"ubuntu-24.04","part":"csv-package","projects":"--project=csv","executable":"release/linux-unpacked/freyalab"},{"os":"windows-2025","part":"shell-md","projects":"--project=shell --project=md","executable":"release/win-unpacked/FreyaLab.exe"},{"os":"windows-2025","part":"csv","projects":"--project=csv"},{"os":"macos-15","part":"shell-md","projects":"--project=shell --project=md"},{"os":"macos-15","part":"csv","projects":"--project=csv"},{"os":"macos-15","part":"package","executable":"release/mac-arm64/FreyaLab.app/Contents/MacOS/FreyaLab"}]'
          ) }}
    runs-on: ${{ matrix.os }}
    env:
      FREYALAB_E2E_FAST_WORKERS: ${{ matrix.os == 'macos-15' && '2' || '1' }}
    # Gate exige la confirmación de las tres plataformas, incluso si una queda cancelada en cola.
    outputs:
      ubuntu_shell_md: ${{ github.event_name == 'pull_request' && matrix.os == 'ubuntu-24.04' && matrix.part == 'shell-md' && job.status == 'success' && 'passed' || '' }}
      ubuntu_csv: ${{ github.event_name == 'pull_request' && matrix.os == 'ubuntu-24.04' && (matrix.part == 'csv' || matrix.part == 'csv-package') && job.status == 'success' && 'passed' || '' }}
      windows_shell_md: ${{ github.event_name == 'pull_request' && matrix.os == 'windows-2025' && matrix.part == 'shell-md' && job.status == 'success' && 'passed' || '' }}
      windows_csv: ${{ github.event_name == 'pull_request' && matrix.os == 'windows-2025' && matrix.part == 'csv' && job.status == 'success' && 'passed' || '' }}
      macos_shell_md: ${{ github.event_name == 'pull_request' && matrix.os == 'macos-15' && matrix.part == 'shell-md' && job.status == 'success' && 'passed' || '' }}
      macos_csv: ${{ github.event_name == 'pull_request' && matrix.os == 'macos-15' && matrix.part == 'csv' && job.status == 'success' && 'passed' || '' }}
    # Ubuntu y Windows: 60 minutos; Intel conserva 90 y ARM, 75.
    timeout-minutes: ${{ matrix.os == 'macos-15-intel' && 90 || matrix.os == 'macos-15' && 75 || ((matrix.os == 'ubuntu-24.04' || matrix.os == 'windows-2025' || startsWith(matrix.os, 'macos-') || !matrix.part) && 60 || 45) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Cache Electron downloads
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.os == 'macOS' && '~/Library/Caches/electron' || runner.os == 'Windows' && '~/AppData/Local/electron/Cache' || '~/.cache/electron' }}
          key: electron-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Cache electron-builder downloads
        if: matrix.executable && (github.event_name != 'pull_request' || needs.areas.outputs.package == 'true')
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/freyalab-electron-builder
          key: electron-builder-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - name: Prepare Electron sandbox helper (Linux)
        if: runner.os == 'Linux'
        run: |
          node -e "require('electron')"
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - run: npm run check
        if: ${{ !matrix.part || matrix.part == 'shell-md' }}
      - run: npm test
        if: ${{ !matrix.part || matrix.part == 'shell-md' }}
      - name: Large-file editor experiments (correctness on small hostile fixtures)
        if: ${{ !matrix.part || matrix.part == 'shell-md' }}
        run: node --test experiments/large-file-editor/tests/overlay.test.mjs
      - run: npm run licenses
        if: matrix.executable
      # El selector existente intersecta las partes Windows, ARM y Ubuntu; se conserva su id.
      - name: Select Windows PR projects
        id: windows_projects
        if: github.event_name == 'pull_request' && matrix.projects
        env:
          FREYALAB_CI_AREAS: ${{ needs.areas.outputs.plan }}
          FREYALAB_CI_PROJECTS: ${{ matrix.projects }}
        run: |
          node --input-type=module -e "
            import {appendFileSync} from 'node:fs';
            import {areaCommand} from './scripts/ci-e2e-area.mjs';
            const projects = areaCommand(process.env.FREYALAB_CI_AREAS, []).slice(2);
            const part = process.env.FREYALAB_CI_PROJECTS.split(' ');
            const fast = projects.filter(project => part.includes(project));
            appendFileSync(process.env.GITHUB_OUTPUT, 'fast=' + fast.join(' ') + '\nserial=' + projects.join(' ') + '\n');
          "
      - name: E2E fast (PR areas)
        id: e2e_fast_pr
        if: github.event_name == 'pull_request' && matrix.part != 'package' && (!matrix.projects || steps.windows_projects.outputs.fast != '')
        env:
          FREYALAB_CI_AREAS: ${{ needs.areas.outputs.plan }}
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-fast
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}npm run ${{ matrix.projects && 'test:e2e:fast' || 'test:e2e:area' }} -- ${{ !matrix.projects && '--phase=fast' || '' }} --workers=${{ env.FREYALAB_E2E_FAST_WORKERS }} --output=test-results-fast ${{ matrix.projects && steps.windows_projects.outputs.fast || '' }}
      - name: E2E fast (Linux)
        id: e2e_fast_linux
        if: github.event_name != 'pull_request' && runner.os == 'Linux'
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-fast
        run: xvfb-run -a npm run test:e2e:fast -- --workers=${{ env.FREYALAB_E2E_FAST_WORKERS }} --output=test-results-fast ${{ matrix.projects }}
      - name: E2E fast (macOS and Windows)
        id: e2e_fast_desktop
        if: github.event_name != 'pull_request' && runner.os != 'Linux' && matrix.part != 'package'
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-fast
        run: npm run test:e2e:fast -- --workers=${{ env.FREYALAB_E2E_FAST_WORKERS }} --output=test-results-fast ${{ matrix.projects }}
      # Shell siempre forma parte del plan de código: serial completa una vez, incluso en un PR sin CSV.
      - name: E2E perf and solo (PR areas)
        if: ${{ !cancelled() && github.event_name == 'pull_request' && matrix.part == 'shell-md' && (steps.e2e_fast_pr.outcome == 'success' || steps.e2e_fast_pr.outcome == 'failure') }}
        env:
          FREYALAB_CI_AREAS: ${{ needs.areas.outputs.plan }}
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-solo
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}npm run ${{ matrix.projects && 'test:e2e:perf' || 'test:e2e:area' }} -- ${{ !matrix.projects && '--phase=serial' || '' }} --workers=1 --output=test-results-solo ${{ matrix.projects && steps.windows_projects.outputs.serial || '' }}
      - name: E2E perf and solo (Linux)
        if: ${{ !cancelled() && runner.os == 'Linux' && matrix.part == 'shell-md' && (steps.e2e_fast_linux.outcome == 'success' || steps.e2e_fast_linux.outcome == 'failure') }}
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-solo
        run: xvfb-run -a npm run test:e2e:perf -- --workers=1 --output=test-results-solo
      - name: E2E perf and solo (macOS and Windows)
        if: ${{ !cancelled() && runner.os != 'Linux' && matrix.part == 'shell-md' && (steps.e2e_fast_desktop.outcome == 'success' || steps.e2e_fast_desktop.outcome == 'failure') }}
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-solo
        run: npm run test:e2e:perf -- --workers=1 --output=test-results-solo
      # Si un PR no elige CSV, su máquina de paquete necesita construir aunque las rápidas se omitan.
      - run: npm run build
        if: ${{ (success() && matrix.part == 'package') || (!cancelled() && runner.os == 'Windows' && matrix.executable && (github.event_name != 'pull_request' || needs.areas.outputs.package == 'true')) || (!cancelled() && success() && runner.os == 'Linux' && matrix.part == 'csv-package' && github.event_name == 'pull_request' && needs.areas.outputs.package == 'true' && steps.e2e_fast_pr.outcome == 'skipped' && steps.windows_projects.outcome == 'success' && steps.windows_projects.outputs.fast == '') }}
      - name: Package application directory
        id: package
        if: ${{ (success() || (!cancelled() && runner.os == 'Windows')) && matrix.executable && (github.event_name != 'pull_request' || needs.areas.outputs.package == 'true') }}
        env:
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/freyalab-electron-builder
        # El lockfile ya fija las sumas de Electron. Pasarlas evita descargar SHASUMS256.txt aun con el ZIP en caché.
        run: |
          node --input-type=commonjs -e "
            const {build} = require('electron-builder');
            build({dir: true, config: {electronDownload: {force: false, checksums: require('electron/checksums.json')}}})
              .catch(error => { console.error(error); process.exitCode = 1; });
          "
      - name: Prepare packaged sandbox helper (Linux)
        if: runner.os == 'Linux' && steps.package.outcome == 'success'
        run: |
          sudo chown root:root release/linux-unpacked/chrome-sandbox
          sudo chmod 4755 release/linux-unpacked/chrome-sandbox
      - name: CSV analysis and transforms in packaged application (Linux)
        if: runner.os == 'Linux' && steps.package.outcome == 'success'
        env:
          FREYALAB_EXECUTABLE: ${{ github.workspace }}/${{ matrix.executable }}
        run: xvfb-run -a npx playwright test tests/e2e/structural-context.spec.ts tests/e2e/commands.spec.ts tests/e2e/search.spec.ts tests/e2e/sql.spec.ts tests/e2e/charts.spec.ts tests/e2e/structure.spec.ts tests/e2e/ordering.spec.ts tests/e2e/range-cancellation.spec.ts tests/e2e/selection-statistics.spec.ts tests/e2e/statistics-reports.spec.ts --output=packaged-test-results
      - name: CSV analysis and transforms in packaged application (macOS and Windows)
        if: ${{ !cancelled() && runner.os != 'Linux' && steps.package.outcome == 'success' && (runner.os == 'Windows' || success()) }}
        env:
          FREYALAB_EXECUTABLE: ${{ github.workspace }}/${{ matrix.executable }}
        run: npx playwright test tests/e2e/structural-context.spec.ts tests/e2e/commands.spec.ts tests/e2e/search.spec.ts tests/e2e/sql.spec.ts tests/e2e/charts.spec.ts tests/e2e/structure.spec.ts tests/e2e/ordering.spec.ts tests/e2e/range-cancellation.spec.ts tests/e2e/selection-statistics.spec.ts tests/e2e/statistics-reports.spec.ts --output=packaged-test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ matrix.os }}${{ matrix.part && format('-{0}', matrix.part) || '' }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
            playwright-report-fast/
            playwright-report-solo/
            test-results-fast/
            test-results-solo/
            packaged-test-results/
          if-no-files-found: warn
  gate:
    name: Gate
    needs: [areas, verify]
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require the plan and its expected verification
        env:
          AREAS_RESULT: ${{ needs.areas.result }}
          DOCS_ONLY: ${{ needs.areas.outputs.docs_only }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          UBUNTU_SHELL_MD: ${{ needs.verify.outputs.ubuntu_shell_md }}
          UBUNTU_CSV: ${{ needs.verify.outputs.ubuntu_csv }}
          WINDOWS_SHELL_MD: ${{ needs.verify.outputs.windows_shell_md }}
          WINDOWS_CSV: ${{ needs.verify.outputs.windows_csv }}
          MACOS_SHELL_MD: ${{ needs.verify.outputs.macos_shell_md }}
          MACOS_CSV: ${{ needs.verify.outputs.macos_csv }}
        run: |
          case "$AREAS_RESULT/$DOCS_ONLY/$VERIFY_RESULT/$UBUNTU_SHELL_MD/$UBUNTU_CSV/$WINDOWS_SHELL_MD/$WINDOWS_CSV/$MACOS_SHELL_MD/$MACOS_CSV" in
            success/true/skipped//////|success/false/success/passed/passed/passed/passed/passed/passed) exit 0 ;;
          esac
          echo "Gate falló. Áreas: $AREAS_RESULT. Solo documentación: ${DOCS_ONLY:-sin plan}. Matriz: $VERIFY_RESULT. Ubuntu shell/md: ${UBUNTU_SHELL_MD:-sin éxito}. Ubuntu CSV: ${UBUNTU_CSV:-sin éxito}. Windows shell/md: ${WINDOWS_SHELL_MD:-sin éxito}. Windows CSV: ${WINDOWS_CSV:-sin éxito}. macOS shell/md: ${MACOS_SHELL_MD:-sin éxito}. macOS CSV: ${MACOS_CSV:-sin éxito}."
          exit 1
